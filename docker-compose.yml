services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      PYTHONUNBUFFERED: "1"
      DEPLOT_CACHE_SIZE: "32"
      DEPLOT_MAX_NEW_TOKENS: "256"
      DEPLOT_TORCH_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - backend_uploads:/app/uploaded_images
      - backend_charts:/app/generated_charts
      - backend_user_data:/app/user_data
      - model_cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_charts:
  backend_user_data:
  model_cache:
